[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
# camel-oasis 和 unstructured 的元数据都要求 <3.12，声明 <3.13 会让
# uv pip check 报不兼容，而 3.12 上 oasis 是否真能长期跑没验证过。
# 收窄到 3.11 与实际依赖对齐。
requires-python = ">=3.11,<3.12"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask[async]>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.91.0",
    # 钉死 minor：graph_builder 继承了 OpenAIGenericClient 并 override 私有方法
    # _generate_response，graphiti_tools / graphiti_entity_reader 走 driver.execute_query
    # 打裸 Cypher，跨 minor 升级要重验这几处
    "graphiti-core>=0.29.3,<0.30.0",
    # 留在 5.x：camel-oasis / camel-ai 原本钉的是 5.23.0，跨到 6.x 是大版本跳跃，
    # 而 graphiti-core 只要 >=5.26.0，没必要冒这个险
    "neo4j>=5.26.0,<6.0.0",
    
    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[tool.uv]
# camel-oasis 0.2.5 把 neo4j 精确钉在 ==5.23.0，而 graphiti-core 从 0.12.0 起要 >=5.26.0。
# 这个钉子是懒钉不是真不兼容：camel-oasis 只在 oasis/social_agent/agent_graph.py 用
# `from neo4j import GraphDatabase`，camel-ai 只用 GraphDatabase / Query / 几个 exception，
# 都是 5.x 全系稳定 API。camel-oasis 已无更新版本（0.2.5 是最新），只能覆盖。
override-dependencies = ["neo4j>=5.26.0,<6.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
