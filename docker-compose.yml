services:
  neo4j:
    # graphiti-core 0.29 要求 driver >=5.26；服务端用 5.26 LTS 与之对齐
    image: neo4j:5.26-community
    # 容器名要和 .env 里 NEO4J_URI=bolt://mirofish-neo4j:7687 的主机名一致
    container_name: mirofish-neo4j
    environment:
      # NEO4J_PASSWORD 从 .env 读，没设就起不来（不给默认值，避免又出现 testpass 这种）
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD 必须在 .env 里设置}"
      # healthcheck 里的 cypher-shell 要用它认证。名字不能带 NEO4J_ 前缀：
      # entrypoint 会把所有 NEO4J_* 当配置项，NEO4J_PASSWORD 会被当成不存在的
      # 配置 "PASSWORD"，严格校验下容器直接起不来。
      HC_PASSWORD: "${NEO4J_PASSWORD}"
      # Graphiti 建图时会打比较重的批量写入，堆给够
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      # 注意映射规则：_ → . 而 __ → _
      # server.memory.pagecache.size 全是点，所以这里是单下划线
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      # 7474 是 Browser，7687 是 bolt
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # cypher-shell 能连上才算就绪，光看端口开没开不够
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${HC_PASSWORD}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  mirofish:
    build: .
    container_name: mirofish
    env_file:
      - .env
    environment:
      # 覆盖 .env 里的值。.env 走的是宿主机开发（bolt://localhost:7687，靠端口映射），
      # 容器里 localhost 指向容器自己，必须用服务名走 compose 网络。
      # environment 的优先级高于 env_file。
      NEO4J_URI: bolt://mirofish-neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "5002:5002"
    restart: unless-stopped
    mem_limit: 16g
    memswap_limit: 16g
    volumes:
      - ./backend/uploads:/app/backend/uploads

volumes:
  neo4j_data:
  neo4j_logs:
